services:
  - type: web
    name: lomoney-api
    runtime: go
    plan: free
    region: ohio
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: GO_VERSION
        value: "1.26"
      - key: GOMEMLIMIT
        value: "400MiB"
      - key: GOGC
        value: "50"
      - key: PORT
        value: "8080"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_KEY
        sync: false
      - key: ADMIN_HOST
        sync: false
      - key: API_HOST
        sync: false
      - key: PUBLIC_HOST
        sync: false
      - key: AGENT_NAME
        sync: false
      - key: BROKERAGE
        sync: false
      - key: LICENCE_NO
        sync: false
      - key: PRIMARY_CITY
        sync: false
      - key: OFFICE_ADDRESS
        sync: false
      - key: OFFICE_PHONE
        sync: false
      - key: EMAIL_API_KEY
        sync: false
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin

  - type: web
    name: lomoney-static
    runtime: static
    plan: free
    region: ohio
    buildCommand: go run ./cmd/sitegen -out public
    staticPublishPath: public
    autoDeploy: false
    envVars:
      - key: GO_VERSION
        value: "1.26"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: API_HOST
        sync: false
      - key: PUBLIC_HOST
        sync: false
      - key: AGENT_NAME
        sync: false
      - key: BROKERAGE
        sync: false
      - key: LICENCE_NO
        sync: false
      - key: PRIMARY_CITY
        sync: false
      - key: OFFICE_ADDRESS
        sync: false
      - key: OFFICE_PHONE
        sync: false
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests
